name: Structurizr diagram export

on:
  push:
    paths: [ "docs/*.dsl" ]

jobs:
  structurizr-export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Export PNG with Structurizr CLI
        uses: structurizr/cli-action@v1
        with:
          args: export -workspace docs/ci-cd.dsl -format png -output docs/diagrams

      - name: Commit generated diagrams
        run: |
          git config user.email "structurizr-bot@users.noreply.github.com"
          git config user.name  "Structurizr Bot"
          git add docs/diagrams
          git commit -m "docs: auto-update architecture diagrams" || exit 0
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
