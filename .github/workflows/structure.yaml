name: Structurizr DSL to Mermaid

on:
  push:
    paths: [ "docs/*.dsl" ]

jobs:
  structurizr-to-mermaid:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Export to Mermaid using Structurizr CLI
      - name: Export Mermaid from DSL
        uses: structurizr/cli-action@v1
        with:
          args: export -workspace docs/ci-cd.dsl -format mermaid -output docs/diagrams

      - name: Commit generated Mermaid diagram(s)
        run: |
          git config user.email "structurizr-bot@users.noreply.github.com"
          git config user.name  "Structurizr Bot"
          git add docs/diagrams
          git commit -m "docs: auto-update Mermaid diagrams" || exit 0
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
