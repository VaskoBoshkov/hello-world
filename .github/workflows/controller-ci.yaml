name: Controller CI

on:
  push:
    branches: [ main ]

env:
  AWS_REGION: us-east-1
  IMAGE_REPO: hello-world
  DEPLOY_TO_ECS: 'false' #this controlls the deployment to ECS ! Just as a PoC we can deploy the new version on both ECS and EKS

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        run: |
          docker build -t ${{ secrets.ECR_REGISTRY }}/${{ env.IMAGE_REPO }}:${GITHUB_RUN_NUMBER} .
          docker push ${{ secrets.ECR_REGISTRY }}/${{ env.IMAGE_REPO }}:${GITHUB_RUN_NUMBER}

      - name: Update Helm values.yaml with new image tag
        run: |
          sed -i "s/tag: .*/tag: ${GITHUB_RUN_NUMBER}/" helm/hello-world/values.yaml
          git config user.email "ci-bot@yourdomain.com"
          git config user.name "CI Bot"
          git add helm/hello-world/values.yaml
          git commit -m "Update image tag to ${GITHUB_RUN_NUMBER} [skip ci]" || echo "No changes to commit"
          git push https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git HEAD:main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger ECS Deploy Pipeline
        if: env.DEPLOY_TO_ECS == 'true'
        uses: peter-evans/workflow-dispatch@v3
        with:
          workflow: deploy-ecs.yaml
          ref: main
