name: Build and Deploy to ECR

on:
  push:
    branches: [ main ]

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
  IMAGE_REPO: hello-world
  GIT_PAT: ${{ secrets.GIT_PAT }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push Docker image to ECR
        run: |
          docker build -t $ECR_REGISTRY/$IMAGE_REPO:${GITHUB_RUN_NUMBER} .
          docker push $ECR_REGISTRY/$IMAGE_REPO:${GITHUB_RUN_NUMBER}

      - name: Update Helm values.yaml with new image tag
        run: | 
          sed -i "s/tag: .*/tag: ${GITHUB_RUN_NUMBER}/" helm/values.yaml

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Update image tag to ${GITHUB_RUN_NUMBER} [skip ci]
          branch: main
          file_pattern: helm/values.yaml
          commit_user_name: CI Bot
          commit_user_email: ci-bot@yourdomain.com
          github_token: ${{ secrets.GIT_PAT }}

