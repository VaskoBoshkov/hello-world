name: Build and Push to AWS ECR

on:
  push:
    branches: [main]

env:
  AWS_REGION: us-east-1
  IMAGE_REPO: hello-world
  ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build -t $ECR_REGISTRY/$IMAGE_REPO:${{ github.run_number }} .
          docker tag $ECR_REGISTRY/$IMAGE_REPO:${{ github.run_number }} $ECR_REGISTRY/$IMAGE_REPO:latest

      - name: Push Docker image to ECR
        run: |
          docker push $ECR_REGISTRY/$IMAGE_REPO:${{ github.run_number }}
          docker push $ECR_REGISTRY/$IMAGE_REPO:latest

      - name: Commit and push Helm changes
        run: |
          git config --global user.email "ci-bot@yourdomain.com"
          git config --global user.name "CI Bot"
          git add helm/values.yaml
          git commit -m "Update image tag to $GITHUB_RUN_NUMBER"
          git push https://x-access-token:${{ secrets.GIT_PAT }}@github.com/${{ github.repository }} HEAD:main
