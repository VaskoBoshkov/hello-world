name: Build and Push to AWS ECR

on:
  push:
    branches: [main]

env:
  AWS_REGION: us-east-1
  IMAGE_REPO: hello-world
  # Option 1: Use repository variable (safer for multi-environment)
  ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
  # Option 2 (if you didn’t add a variable): uncomment the line below
  # ECR_REGISTRY: 454563073530.dkr.ecr.us-east-1.amazonaws.com

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build -t $ECR_REGISTRY/$IMAGE_REPO:${{ github.run_number }} .
          docker tag $ECR_REGISTRY/$IMAGE_REPO:${{ github.run_number }} $ECR_REGISTRY/$IMAGE_REPO:latest

      - name: Push Docker image to ECR
        run: |
          docker push $ECR_REGISTRY/$IMAGE_REPO:${{ github.run_number }}
          docker push $ECR_REGISTRY/$IMAGE_REPO:latest
